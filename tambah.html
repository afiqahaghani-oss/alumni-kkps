<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Alumni - Tracer Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kkps-navy': '#002147' } } } }
    </script>
</head>
<body class="bg-gray-100">

    <nav class="bg-kkps-navy text-white p-4 shadow-md mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Pendaftaran Alumni Baru</h1>
            <a href="urus.html" class="bg-white text-kkps-navy px-4 py-2 rounded-lg font-bold hover:bg-gray-200 transition">Urus Rekod →</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 pb-20">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-4xl mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-kkps-navy border-b pb-2">Maklumat Alumni</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div><label class="block text-sm font-medium text-gray-700">No. Kad Pengenalan *</label><input type="text" id="i_ic" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">Nama Penuh *</label><input type="text" id="i_name" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">Program Pengajian</label><input type="text" id="i_program" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">Tahun Konvokesyen</label><input type="text" id="i_tahun" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">No. Telefon</label><input type="text" id="i_notel" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none"></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status Pekerjaan</label>
                    <select id="i_statusKerja" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none">
                        <option value="Bekerja">Bekerja</option>
                        <option value="Menyambung Pelajaran">Menyambung Pelajaran</option>
                        <option value="Mencari Pekerjaan">Mencari Pekerjaan</option>
                    </select>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">Taraf Pekerjaan</label><input type="text" id="i_tarafKerja" placeholder="Tetap / Kontrak" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">Sektor Pekerjaan</label><input type="text" id="i_sektorKerja" placeholder="Kerajaan / Swasta" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">Pendapatan Bulanan (RM)</label><input type="text" id="i_pendapatan" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">Jawatan</label><input type="text" id="i_jawatan" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">Syarikat / Agensi</label><input type="text" id="i_syarikat" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">Tempoh Menunggu Pekerjaan</label><input type="text" id="i_tempoh" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">URL Video (ID Youtube)</label><input type="text" id="i_video" placeholder="e.g. dQw4w9WgXcQ" class="w-full p-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700">URL Gambar Profil</label><input type="text" id="i_gambar" placeholder="Link gambar..." class="w-full p-2 border rounded-lg"></div>
            </div>

            <button id="btnSimpan" onclick="addAlumni()" class="w-full bg-green-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-green-700 transition">SIMPAN REKOD BARU</button>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5ss1rgJZYAHy7f4QcRCE_opSLpPg27yyJHMEXAzPW8cnBHipJpriRoL_apldNv9NrRg/exec";

        function addAlumni() {
            const btn = document.getElementById('btnSimpan'); 
            const formData = new URLSearchParams();
            
            formData.append('action', 'tambah');
            formData.append('icNumber', document.getElementById('i_ic').value);
            formData.append('name', document.getElementById('i_name').value);
            formData.append('program', document.getElementById('i_program').value);
            formData.append('tahunKonvo', document.getElementById('i_tahun').value);
            formData.append('noTel', document.getElementById('i_notel').value);
            formData.append('statusKerja', document.getElementById('i_statusKerja').value);
            formData.append('tarafKerja', document.getElementById('i_tarafKerja').value);
            formData.append('sektorKerja', document.getElementById('i_sektorKerja').value);
            formData.append('pendapatan', document.getElementById('i_pendapatan').value);
            formData.append('jawatan', document.getElementById('i_jawatan').value);
            formData.append('syarikat', document.getElementById('i_syarikat').value);
            formData.append('tempohMenunggu', document.getElementById('i_tempoh').value);
            formData.append('videoUrl', document.getElementById('i_video').value);
            formData.append('gambarUrl', document.getElementById('i_gambar').value);

            if(!document.getElementById('i_ic').value || !document.getElementById('i_name').value) {
                return alert("Sila isi No KP dan Nama!");
            }

            btn.innerText = "SEDANG DISIMPAN...";
            btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData })
            .then(() => {
                alert("Data Berjaya Disimpan ke Google Sheets!");
                location.reload(); 
            }).catch(err => {
                alert("Ralat: " + err);
                btn.disabled = false;
                btn.innerText = "SIMPAN REKOD BARU";
            });
        }
    </script>
</body>
</html>
