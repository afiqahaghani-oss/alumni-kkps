<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direktori Alumni - Tracer Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { colors: { 'kkps-navy': '#002147' } } 
            } 
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- NAVIGATION BAR -->
    <nav class="bg-kkps-navy text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 Direktori Alumni
            </h1>
            <a href="urus.html" class="bg-white text-kkps-navy px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 transition">
                Portal Admin 🔒
            </a>
        </div>
    </nav>

    <!-- HEADER / HERO SECTION -->
    <header class="bg-white shadow-sm mb-8 py-10">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Kajian Pengesanan Alumni</h2>
            <p class="text-gray-500 max-w-2xl mx-auto">Kenali graduan kami yang kini sedang membina kerjaya di pelbagai sektor industri. Kebanggaan institusi, inspirasi masa depan.</p>
        </div>
    </header>

    <!-- MAIN CONTENT (CARDS) -->
    <main class="container mx-auto px-4 pb-20">
        
        <!-- Loading Indicator -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-kkps-navy mb-4"></div>
            <p class="text-gray-500 font-medium animate-pulse">Sedang memuatkan senarai alumni...</p>
        </div>

        <!-- Grid Container untuk Card -->
        <div id="alumniGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Kad-kad alumni akan dijana di sini oleh JavaScript -->
        </div>

    </main>

    <script>
        // MASUKKAN URL NEW DEPLOYMENT AWAK DI SINI!!
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZwCkGHkUGd_ArNumpi6_BRa3-Kq-hwODJAGaZOHBMGGa07t6oGMPrhzUbDVZxejyOVw/exec";

        function loadPublicData() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(rows => {
                    // Sembunyikan loader
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('alumniGrid').classList.remove('hidden');

                    const grid = document.getElementById('alumniGrid');
                    
                    if (rows.length === 0) {
                        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Tiada rekod alumni dijumpai buat masa ini.</div>`;
                        return;
                    }

                    // Loop data dan bina Card
                    grid.innerHTML = rows.map(row => {
                        // Extract data mengikut susunan lajur (14 lajur)
                        const name = row[1] || "Tanpa Nama";
                        const program = row[2] || "Tiada Maklumat Program";
                        const tahunKonvo = row[3] || "-";
                        const statusKerja = row[5] || "-";
                        const jawatan = row[9] || "";
                        const syarikat = row[10] || "";
                        const videoUrl = row[12] || "";
                        
                        // Gambar default jika alumni tak letak URL gambar
                        // Ambil URL gambar dari pangkalan data
let gambarUrlAsal = row[13] || "";
let gambarUrl = "";

if (gambarUrlAsal.includes("drive.google.com")) {
    // Ekstrak ID Gambar dan tukar kepada format Thumbnail yang kebal sekatan
    let idGambar = gambarUrlAsal.split("id=")[1];
    if (idGambar) {
        // sz=w500 bermaksud saiz lebar 500px, cukup jelas dan ringan
        gambarUrl = "https://drive.google.com/thumbnail?id=" + idGambar + "&sz=w500";
    } else {
        gambarUrl = gambarUrlAsal;
    }
} else if (gambarUrlAsal !== "") {
    gambarUrl = gambarUrlAsal;
} else {
    // Gambar lalai (default) jika alumni tiada gambar
    gambarUrl = "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=002147&color=fff&size=200";
}

                        // Logik paparan Pekerjaan: Hanya tunjuk jika status "Bekerja"
                        let maklumatKerjaHtml = '';
                        if (statusKerja.toLowerCase() === 'bekerja') {
                            maklumatKerjaHtml = `
                                <div class="mt-4 pt-4 border-t border-gray-100">
                                    <p class="text-xs text-gray-500 uppercase tracking-wider font-bold">Pekerjaan Kini</p>
                                    <p class="text-sm font-semibold text-gray-800 line-clamp-1">${jawatan || 'Tiada maklumat jawatan'}</p>
                                    <p class="text-sm text-gray-600 line-clamp-1">di ${syarikat || 'Tiada maklumat syarikat'}</p>
                                </div>
                            `;
                        } else {
                            maklumatKerjaHtml = `
                                <div class="mt-4 pt-4 border-t border-gray-100">
                                    <p class="text-xs text-gray-500 uppercase tracking-wider font-bold">Status Semasa</p>
                                    <span class="inline-block px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold mt-1">
                                        ${statusKerja}
                                    </span>
                                </div>
                            `;
                        }

                        // Logik butang Video YouTube
                        let butangVideoHtml = '';
                        if (videoUrl && videoUrl !== "undefined" && videoUrl !== "") {
                            butangVideoHtml = `
                                <a href="https://www.youtube.com/watch?v=${videoUrl}" target="_blank" 
                                   class="mt-4 w-full block text-center bg-red-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-red-700 transition">
                                   ▶ Tonton Video Pengalaman
                                </a>
                            `;
                        }

                        // Return HTML untuk satu Card
                        return `
                            <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col">
                                <div class="h-32 bg-kkps-navy relative">
                                    <!-- Profil Gambar yang bertindih di atas background banner -->
                                    <img src="${gambarUrl}" alt="Gambar ${name}" class="w-24 h-24 object-cover rounded-full border-4 border-white absolute -bottom-10 left-1/2 transform -translate-x-1/2 shadow-sm bg-white">
                                </div>
                                <div class="pt-12 p-6 flex-1 flex flex-col">
                                    <div class="text-center mb-2">
                                        <h3 class="text-lg font-bold text-gray-800 line-clamp-1" title="${name}">${name}</h3>
                                        <p class="text-xs text-gray-500 mt-1">Tahun Konvokesyen ${tahunKonvo}</p>
                                    </div>
                                    <div class="text-center mb-4">
                                        <span class="inline-block px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-medium">
                                            ${program}
                                        </span>
                                    </div>
                                    
                                    <div class="mt-auto">
                                        ${maklumatKerjaHtml}
                                        ${butangVideoHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                })
                .catch(err => {
                    console.error("Ralat:", err);
                    document.getElementById('loader').innerHTML = `
                        <div class="text-red-500 text-center bg-red-50 p-6 rounded-lg">
                            <p class="font-bold text-lg mb-2">Gagal Memuatkan Data</p>
                            <p class="text-sm">Sila pastikan URL Web App Google Script anda betul dan mempunyai kebenaran akses "Anyone".</p>
                        </div>
                    `;
                });
        }

        // Panggil fungsi sebaik sahaja page siap diload
        window.onload = loadPublicData;
    </script>
</body>
</html>
