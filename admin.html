<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Alumni KKPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'kkps-navy': '#002147' } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-kkps-navy text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Admin Portal SRDA</h1>
            <a href="index.html" class="hover:underline">Kembali ke Laman Utama</a>
        </div>
    </nav>

    <main class="container mx-auto py-10 px-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Bahagian Tambah Alumni -->
            <div class="bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-2xl font-bold mb-6 text-kkps-navy border-b pb-2">Tambah Alumni</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Penuh</label>
                        <input type="text" id="newName" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-kkps-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kursus</label>
                        <select id="newCourse" class="w-full p-2 border rounded-lg">
                            <option value="Multimedia">Multimedia</option>
                            <option value="Elektrik">Elektrik</option>
                            <option value="Kulinari">Kulinari</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Pekerjaan / Status</label>
                        <input type="text" id="newStatus" class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Video ID (YouTube)</label>
                        <input type="text" id="newVideo" placeholder="e.g. dQw4w9WgXcQ" class="w-full p-2 border rounded-lg">
                    </div>
                    <!-- Ditambah id="btnSimpan" di sini -->
                    <button id="btnSimpan" onclick="addAlumni()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">SIMPAN DATA</button>
                </div>
            </div>

            <!-- Bahagian Urus Rekod -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-kkps-navy border-b pb-2">Urus Rekod Alumni</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="p-3 border">Nama</th>
                                <th class="p-3 border">Kursus</th>
                                <th class="p-3 border text-center">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydeQnEyqKjCevNXdGI5DwdKrHnR-SWMh_oCne7Puh7Jw9ugIaNeQCMWBJihCDsaIz2fA/exec";
        let alumniData = []; 

        // 1. Ambil data live dari Google Sheets
        function loadAdminData() {
            const tableBody = document.getElementById('adminTableBody');
            tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500 animate-pulse">Sedang memuatkan data dari Google Sheets...</td></tr>`;

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(rows => {
                    alumniData = rows.map(row => ({
                        name: row[0],      
                        course: row[1],    
                        status: row[2],    
                        videoUrl: row[3]   
                    }));
                    renderAdminTable();
                })
                .catch(err => {
                    console.error("Ralat memuatkan data:", err);
                    tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-500 font-bold">Gagal memuatkan data database. Sila refresh halaman.</td></tr>`;
                });
        }

        // 2. Bina paparan jadual
        function renderAdminTable() {
            const tableBody = document.getElementById('adminTableBody');
            
            if (alumniData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">Tiada rekod alumni dijumpai di dalam database.</td></tr>`;
                return;
            }

            tableBody.innerHTML = alumniData.map((alumnus, index) => `
                <tr class="hover:bg-gray-50 border-b">
                    <td class="p-3 font-medium text-gray-800">${alumnus.name}</td>
                    <td class="p-3 text-gray-600">${alumnus.course}</td>
                    <td class="p-3 text-center">
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-semibold">Tersimpan di Cloud</span>
                    </td>
                </tr>
            `).join('');
        }

        // 3. Tambah data ke Google Sheets (Telah diperkukuhkan)
        function addAlumni() {
            // Menggunakan ID khusus supaya tidak silap pilih elemen
            const btn = document.getElementById('btnSimpan'); 
            const name = document.getElementById('newName').value;
            const course = document.getElementById('newCourse').value;
            const status = document.getElementById('newStatus').value;
            const video = document.getElementById('newVideo').value;

            if(!name || !status) return alert("Sila isi maklumat!");

            // Mengunci butang supaya tidak berlaku double-submit
            btn.innerText = "SEDANG DISIMPAN...";
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('course', course);
            formData.append('status', status);
            formData.append('videoUrl', video);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                body: formData
            }).then(() => {
                alert("Data Berjaya Disimpan ke Google Sheets!");
                
                // Kosongkan semula form input
                document.getElementById('newName').value = '';
                document.getElementById('newStatus').value = '';
                document.getElementById('newVideo').value = '';
                
                // Membuka kunci butang semula selepas selesai proses
                btn.innerText = "SIMPAN DATA";
                btn.disabled = false;
                
                // Beri masa 1 saat sebelum refresh table bagi mengelakkan Google Script bertembung (handling lock)
                setTimeout(loadAdminData, 1000); 
            }).catch(err => {
                alert("Ralat sistem: " + err);
                btn.innerText = "SIMPAN DATA";
                btn.disabled = false;
            });
        }

        // Jalankan fungsi memuatkan data sebaik sahaja page dibuka
        window.onload = loadAdminData;
    </script>
</body>
</html>
